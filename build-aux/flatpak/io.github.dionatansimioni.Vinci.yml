id: io.github.dionatansimioni.Vinci
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: vinci
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # Latest-version check and signed recipe updates (all optional, offline-first).
  - --share=network
  # podman, distrobox and pkexec run on the host through flatpak-spawn --host,
  # the same approach as BoxBuddy and DistroShelf on Flathub.
  - --talk-name=org.freedesktop.Flatpak
  # The installer in ~/Downloads, the Resolve menu entry/icon/MIME in ~/.local/share,
  # media to convert anywhere in the home folder.
  - --filesystem=home
  # Tray icon for background conversions.
  - --talk-name=org.kde.StatusNotifierWatcher
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/vinci/cargo
    CARGO_NET_OFFLINE: 'true'
modules:
  - name: vinci
    buildsystem: simple
    build-commands:
      - cargo build --release --locked -p vinci
      - install -Dm755 target/release/vinci /app/bin/vinci
      - install -Dm644 data/io.github.dionatansimioni.Vinci.desktop -t /app/share/applications
      - install -Dm644 data/io.github.dionatansimioni.Vinci.metainfo.xml -t /app/share/metainfo
      - install -Dm644 data/icons/io.github.dionatansimioni.Vinci.svg -t /app/share/icons/hicolor/scalable/apps
      - |
        for lang in $(grep -v '^#' po/LINGUAS); do
          install -d /app/share/locale/$lang/LC_MESSAGES
          msgfmt -o /app/share/locale/$lang/LC_MESSAGES/vinci.mo po/$lang.po
        done
    sources:
      - type: dir
        path: ../..
      # Generated with flatpak-cargo-generator.py from Cargo.lock (see build-aux/README.md).
      - cargo-sources.json
