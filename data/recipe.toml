# Vinci recipe: everything about the outside world that changes over time.
#
# Embedded in the app and shipped with each release: to change what Vinci installs, edit
# this file and release a new version. Purely declarative: no shell snippets, and every
# field is validated (a broken edit fails `cargo test`).
# Bump `revision` on every change; bump `schema` only when the format changes.

schema = 1
revision = 5

[container]
image = "docker.io/library/ubuntu:24.04"
mirrors = ["public.ecr.aws/ubuntu/ubuntu:24.04"]
name_prefix = "vinci"

[distrobox]
# Host copies inside [min_host, max_host) are used as-is; otherwise we install `pinned`.
pinned = "1.8.2.5"
min_host = "1.8.0"
max_host = "2.0.0"
install_url = "https://raw.githubusercontent.com/89luca89/distrobox/1.8.2.5/install"

[packages]
# Runtime libraries DaVinci Resolve links against on Ubuntu 24.04, plus our tools.
base = [
    "ca-certificates",
    "curl",
    "unzip",
    "xdg-utils",
    "ffmpeg",
    "clinfo",
    "ocl-icd-libopencl1",
    "libapr1t64",
    "libaprutil1t64",
    "libasound2t64",
    "libglib2.0-0t64",
    "libgl1",
    "libglu1-mesa",
    "libegl1",
    "libfuse2t64",
    "libdbus-1-3",
    "libxcb-cursor0",
    "libxcb-icccm4",
    "libxcb-image0",
    "libxcb-keysyms1",
    "libxcb-randr0",
    "libxcb-render-util0",
    "libxcb-shape0",
    "libxcb-xinerama0",
    "libxcb-xkb1",
    "libxkbcommon-x11-0",
    "libxrandr2",
    "libxinerama1",
    "libxcursor1",
    "libxi6",
    "libxtst6",
    # Reported missing by the 21.1.2 installer's own package check.
    "libice6",
    "libsm6",
    "libxcb-composite0",
    "libxcb-damage0",
    "libxcb-xinput0",
    # Found with scripts/missing-libs.sh on a clean container (21.1.2): USD plugin (libXt),
    # Chromium-based graphics host (NSS/NSPR, xkbfile, GLES).
    "libxt6t64",
    "libnss3",
    "libnspr4",
    "libxkbfile1",
    "libgles2",
]

[gpu.nvidia]
# The host driver's userspace is mounted by `distrobox create --nvidia`.
packages = []

[gpu.amd]
# mesa-va-drivers: VA-API for hardware video encoding in the Media tab (without it ffmpeg
# fails with "vaapi_device: Input/output error").
packages = ["rocm-opencl-runtime", "mesa-va-drivers"]

[gpu.amd.apt_repo]
name = "rocm"
key_url = "https://repo.radeon.com/rocm/rocm.gpg.key"
url = "https://repo.radeon.com/rocm/apt/7.2.4"
suite = "noble"
components = ["main"]

[gpu.intel]
experimental = true
# Ubuntu 24.04's own intel-opencl-icd (23.43) predates working OpenCL/OpenGL sharing on
# Linux (compute-runtime 24.13), which Resolve needs; with it Resolve can stall on its
# splash screen.
# The Ubuntu team's Intel graphics PPA (the one Intel's install guide points to) has
# current releases for every GPU Vinci accepts (Gen12 and newer).
# intel-media-va-driver + libmfx-gen1.2: VA-API and Quick Sync for the Media tab.
packages = ["intel-opencl-icd", "intel-media-va-driver", "libmfx-gen1.2"]

[gpu.intel.apt_repo]
name = "intel-graphics"
key_url = "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x0C0E6AF955CE463C03FC51574D098D70AFBE5E1F"
url = "https://ppa.launchpadcontent.net/kobuk-team/intel-graphics/ubuntu"
suite = "noble"
components = ["main"]

[resolve]
install_dir = "/opt/resolve"
# -i: no GUI, -y: no prompts, -a: allow root (we run it with sudo inside the box).
# The installer exits 0 even when it aborts, so the plan verifies the result instead.
installer_args = ["-i", "-y", "-a"]
# Bundled libraries that clash with the system ones on Ubuntu (paths relative to install_dir).
remove_libs = [
    "libs/libglib-2.0.so*",
    "libs/libgio-2.0.so*",
    "libs/libgmodule-2.0.so*",
]

# udev rules Resolve installs inside the container (paths relative to the container's /).
# Copied to the host only after passing core::udev's allow-list.
udev_rules = [
    "opt/resolve/share/etc/udev/rules.d/*.rules",
    "usr/lib/udev/rules.d/75-davinci*.rules",
]

[resolve.installer_env]
SKIP_PACKAGE_CHECK = "1"

[launcher]
# Relative to resolve.install_dir; copied to the host icon theme.
icon = "graphics/DV_Resolve.png"
mime_types = ["application/x-resolveproj", "application/x-resolvetimeline"]

[launcher.env]
QT_QPA_PLATFORM = "xcb"

[blackmagic]
latest_free = "https://www.blackmagicdesign.com/api/support/latest-stable-version/davinci-resolve/linux"
latest_studio = "https://www.blackmagicdesign.com/api/support/latest-stable-version/davinci-resolve-studio/linux"
download_page = "https://www.blackmagicdesign.com/products/davinciresolve"
