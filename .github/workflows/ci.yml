name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # 24.04 ships GTK 4.14 / libadwaita 1.5, the floor the app targets.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Builds the real container from the recipe and runs the ffmpeg end-to-end test inside it.
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build test binary
        run: cargo test -p rli-core --lib --no-run
      - name: Real ffmpeg, conversion and network tests inside Ubuntu 24.04
        run: |
          bin=$(ls -t target/debug/deps/rli_core-* | grep -v '\.d$' | head -1)
          podman run --rm --network host -v "$PWD:$PWD" -w "$PWD" docker.io/library/ubuntu:24.04 sh -c \
            "apt-get update --error-on=any -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg >/dev/null && $bin --ignored real_"
